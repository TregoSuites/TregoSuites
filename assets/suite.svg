<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 165 660 340" width="660" height="340" role="img" aria-label="A 10 by 16 foot Trego Suite: metal shed roof, vertical LP SmartSide siding, four windows and an insulated steel entry door, set on skids." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#474d56"/>
      <stop offset="1" stop-color="#2f343b"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f4f1"/>
      <stop offset="1" stop-color="#e9e6e0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#dcebf3"/>
      <stop offset="1" stop-color="#bed3e0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3dfd8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ddd8d0"/>
      <stop offset="1" stop-color="#e3dfd8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ground -->
  <rect x="40" y="446" width="690" height="3" fill="url(#ground)"/>
  <ellipse cx="420" cy="452" rx="300" ry="13" fill="#000" opacity="0.07"/>

  <!-- roof plane -->
  <polygon points="218,221 712,251 602,211 108,181" fill="url(#roof)"/>
  <!-- standing seams -->
  <g stroke="#20242a" stroke-width="1.1" opacity="0.5">
    <line x1="263" y1="217.3" x2="153" y2="177.3"/>
    <line x1="308" y1="220.0" x2="198" y2="180.0"/>
    <line x1="353" y1="222.7" x2="243" y2="182.7"/>
    <line x1="398" y1="225.4" x2="288" y2="185.4"/>
    <line x1="443" y1="228.1" x2="333" y2="188.1"/>
    <line x1="488" y1="230.8" x2="378" y2="190.8"/>
    <line x1="533" y1="233.5" x2="423" y2="193.5"/>
    <line x1="578" y1="236.2" x2="468" y2="196.2"/>
    <line x1="623" y1="238.9" x2="513" y2="198.9"/>
    <line x1="668" y1="241.6" x2="558" y2="201.6"/>
  </g>
  <!-- fascia -->
  <polygon points="218,221 712,251 712,261 218,231" fill="#ffffff"/>
  <polygon points="218,221 108,181 108,191 218,231" fill="#f0ede8"/>

  <!-- end wall (left, receding) -->
  <polygon points="230,231 120,191 120,399 230,431" fill="#e4e1db"/>
  <!-- end wall window -->
  <polygon points="150,241 200,259 200,333 150,315" fill="#ffffff"/>
  <polygon points="155,246 196,261 196,328 155,311" fill="url(#glass)"/>
  <line x1="155" y1="278.5" x2="196" y2="293.5" stroke="#ffffff" stroke-width="3"/>
  <!-- corner trim -->
  <polygon points="226,230 236,233 236,434 226,431" fill="#ffffff"/>

  <!-- front wall (sheared parallelogram) -->
  <g transform="matrix(1,0.0596,0,1,0,-13.708)">
    <rect x="230" y="230" width="470" height="200" fill="url(#front)"/>
    <g stroke="#dcd7cf" stroke-width="1">
      <line x1="254" y1="230" x2="254" y2="430"/>
      <line x1="278" y1="230" x2="278" y2="430"/>
      <line x1="302" y1="230" x2="302" y2="430"/>
      <line x1="326" y1="230" x2="326" y2="430"/>
      <line x1="350" y1="230" x2="350" y2="430"/>
      <line x1="374" y1="230" x2="374" y2="430"/>
      <line x1="398" y1="230" x2="398" y2="430"/>
      <line x1="422" y1="230" x2="422" y2="430"/>
      <line x1="446" y1="230" x2="446" y2="430"/>
      <line x1="470" y1="230" x2="470" y2="430"/>
      <line x1="494" y1="230" x2="494" y2="430"/>
      <line x1="518" y1="230" x2="518" y2="430"/>
      <line x1="542" y1="230" x2="542" y2="430"/>
      <line x1="566" y1="230" x2="566" y2="430"/>
      <line x1="590" y1="230" x2="590" y2="430"/>
      <line x1="614" y1="230" x2="614" y2="430"/>
      <line x1="638" y1="230" x2="638" y2="430"/>
      <line x1="662" y1="230" x2="662" y2="430"/>
      <line x1="686" y1="230" x2="686" y2="430"/>
    </g>

    <!-- windows -->
    <g>
      <rect x="268" y="262" width="64" height="74" fill="#ffffff"/>
      <rect x="273" y="267" width="54" height="64" fill="url(#glass)"/>
      <line x1="273" y1="299" x2="327" y2="299" stroke="#ffffff" stroke-width="3"/>

      <rect x="352" y="262" width="64" height="74" fill="#ffffff"/>
      <rect x="357" y="267" width="54" height="64" fill="url(#glass)"/>
      <line x1="357" y1="299" x2="411" y2="299" stroke="#ffffff" stroke-width="3"/>

      <rect x="552" y="262" width="64" height="74" fill="#ffffff"/>
      <rect x="557" y="267" width="54" height="64" fill="url(#glass)"/>
      <line x1="557" y1="299" x2="611" y2="299" stroke="#ffffff" stroke-width="3"/>

      <rect x="632" y="262" width="64" height="74" fill="#ffffff"/>
      <rect x="637" y="267" width="54" height="64" fill="url(#glass)"/>
      <line x1="637" y1="299" x2="691" y2="299" stroke="#ffffff" stroke-width="3"/>
    </g>

    <!-- door -->
    <rect x="440" y="256" width="78" height="174" fill="#ffffff"/>
    <rect x="446" y="262" width="66" height="168" fill="#343b44"/>
    <rect x="453" y="272" width="52" height="60" fill="#3d4650"/>
    <rect x="453" y="344" width="52" height="74" fill="#3d4650"/>
    <circle cx="504" cy="352" r="3.4" fill="#cfcac2"/>

    <!-- bottom trim -->
    <rect x="230" y="424" width="470" height="8" fill="#ffffff"/>
  </g>

  <!-- skids -->
  <polygon points="230,432 700,460 700,470 230,442" fill="#9d978d"/>
  <polygon points="230,432 120,400 120,410 230,442" fill="#8a8479"/>

  <!-- dimension line -->
  <g stroke="#b9521f" stroke-width="1.4" fill="none">
    <line x1="230" y1="486" x2="700" y2="486"/>
    <line x1="230" y1="480" x2="230" y2="492"/>
    <line x1="700" y1="480" x2="700" y2="492"/>
  </g>
  <text x="465" y="480" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#b9521f">16'-0"</text>
</svg>
